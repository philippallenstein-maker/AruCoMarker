<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aruco Phone v.1</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page">
    <section class="panel">
      <h1>Phone / Kamera v1</h1>
      <p id="status">Status: bereit</p>
      <div class="button-row">
        <button id="startBtn">Kamera starten</button>
        <button id="stopBtn">Kamera stoppen</button>
      </div>
      <div class="info-grid">
        <p>Ref-ID: <span id="refId">-</span></p>
        <p>Distanz: <span id="distance">-</span></p>
        <p>X: <span id="posX">-</span></p>
        <p>Y: <span id="posY">-</span></p>
        <p>Z: <span id="posZ">-</span></p>
      </div>
    </section>

    <section class="panel">
      <canvas id="canvas"></canvas>
      <video id="video" autoplay playsinline muted hidden></video>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
